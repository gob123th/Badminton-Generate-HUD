<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badminton HUD</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="5e234b0d-79e6-459c-8d1f-7938cd579cfd"></script>
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs",
      "mediabunny": "https://cdn.jsdelivr.net/npm/mediabunny@1.60.0/dist/bundles/mediabunny.min.mjs"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="browser-warn" class="browser-warn" role="alert" hidden>
    <span data-i18n="browser.warn"></span>
    <button class="ghost" id="browser-warn-x" data-i18n-title="close">✕</button>
  </div>
  <header class="topbar">
    <div class="brand"><span class="mark"></span>BADMINTON <b>HUD</b></div>
    <div class="sub" data-i18n="sub"></div>
    <div class="badges">
      <span id="badge-gpu" class="badge" data-i18n="badge.checking"></span>
      <div class="lang" role="group" aria-label="Language"><button class="ghost" data-lang="th">TH</button><button class="ghost" data-lang="en">EN</button></div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <nav class="stepper" id="stepper">
        <button data-go="video"><i>1</i><span data-i18n="step.video"></span></button>
        <button data-go="court"><i>2</i><span data-i18n="step.court"></span></button>
        <button data-go="players"><i>3</i><span data-i18n="step.players"></span></button>
        <button data-go="render"><i>4</i><span data-i18n="step.render"></span></button>
      </nav>
      <section class="step" data-step="video">
        <h2><i>1</i><span data-i18n="step.video"></span></h2>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="video/*,.mp4,.mov,.mkv,.webm" hidden>
          <span id="drop-text" data-i18n="drop"></span>
        </label>
        <div id="video-info" class="info muted"></div>
        <div class="row range">
          <label><span data-i18n="start"></span><input type="number" id="start" min="0" step="0.1" value="0"></label>
          <label><span data-i18n="end"></span><input type="number" id="end" min="0" step="0.1"></label>
        </div>
        <div class="row">
          <button class="ghost" id="btn-test15" data-i18n="test15"></button>
          <button class="ghost" id="btn-full" data-i18n="full"></button>
        </div>
        <div class="step-nav">
          <button class="primary" data-go="court" data-i18n="nav.next"></button>
        </div>
      </section>

      <section class="step" data-step="court">
        <h2><i>2</i><span data-i18n="step.court"></span></h2>
        <div class="row">
          <label><span data-i18n="orientation"></span>
            <select id="orientation">
              <option value="behind" data-i18n="orient.behind"></option>
              <option value="side" data-i18n="orient.side"></option>
            </select>
          </label>
        </div>
        <div class="row">
          <button class="ghost" id="btn-undo" data-i18n="undo"></button>
          <button class="ghost" id="btn-reset" data-i18n="reset"></button>
        </div>
        <p class="hint" data-i18n="court.hint"></p>
        <div id="court-status" class="status"></div>
        <div class="step-nav">
          <button class="ghost" data-go="video" data-i18n="nav.back"></button>
          <button class="primary" data-go="players" data-i18n="nav.next"></button>
        </div>
      </section>

      <section class="step" data-step="players">
        <h2><i>3</i><span data-i18n="step.players"></span></h2>
        <div class="row pick">
          <label><span data-i18n="pick"></span><input type="range" id="pick-t" min="0" step="0.1" value="0"></label>
          <input type="number" id="pick-n" min="0" step="0.1" value="0" data-i18n-title="seconds" data-i18n-aria="pick">
          <button class="ghost" id="pick-prev" data-i18n-title="back1">◀</button>
          <button class="ghost" id="pick-next" data-i18n-title="fwd1">▶</button>
        </div>
        <div class="row">
          <button class="ghost" id="btn-detect" data-i18n="detect"></button>
          <button class="ghost" id="btn-add-player" data-i18n="addPlayer"></button>
        </div>
        <div id="cards" class="cards"></div>
        <div id="assign-status" class="status"></div>
        <p class="hint" data-i18n="players.hint"></p>
        <div class="row">
          <button class="ghost" id="btn-export">Export config</button>
          <label class="ghost button">Import<input type="file" id="import" accept=".json" hidden></label>
        </div>
        <div class="step-nav">
          <button class="ghost" data-go="court" data-i18n="nav.back"></button>
          <button class="primary" data-go="render" data-i18n="nav.next"></button>
        </div>
      </section>

      <section class="step" data-step="render">
        <h2><i>4</i><span data-i18n="step.render"></span></h2>
        <div class="row">
          <label><span data-i18n="model"></span>
            <select id="model">
              <option value="models/yolo11s-pose.onnx" data-i18n="model.s"></option>
              <option value="models/yolo11n-pose.onnx" data-i18n="model.n"></option>
            </select>
          </label>
          <label><span data-i18n="stride"></span>
            <select id="stride">
              <option value="1" data-i18n="stride.1"></option>
              <option value="2" data-i18n="stride.2"></option>
              <option value="3" data-i18n="stride.3"></option>
              <option value="5" data-i18n="stride.5"></option>
            </select>
          </label>
        </div>
        <div class="toggles">
          <label><input type="checkbox" id="r-tags"> <span data-i18n="opt.tags"></span></label>
          <label><input type="checkbox" id="r-topHud"> <span data-i18n="opt.topHud"></span></label>
          <label><input type="checkbox" id="r-playerPanel"> <span data-i18n="opt.playerPanel"></span></label>
          <label><input type="checkbox" id="r-courtMap"> <span data-i18n="opt.courtMap"></span></label>
          <label><input type="checkbox" id="r-shuttle"> <span data-i18n="opt.shuttle"></span></label>
          <label data-i18n-title="opt.assist.tip"><input type="checkbox" id="m-assist"> <span data-i18n="opt.assist"></span></label>
          <label><input type="checkbox" id="r-showIds"> <span data-i18n="opt.showIds"></span></label>
        </div>
        <div class="style-opts">
          <div class="row">
            <label><span data-i18n="stage"></span>
              <select id="stage-mode">
                <option value="overlay" data-i18n="stage.overlay"></option>
                <option value="landscape" data-i18n="stage.landscape"></option>
                <option value="portrait" data-i18n="stage.portrait"></option>
              </select>
            </label>
          </div>
          <div class="row">
            <label><span data-i18n="theme"></span>
              <select id="theme">
                <option value="broadcast" data-i18n="theme.broadcast"></option>
                <option value="esports" data-i18n="theme.esports"></option>
                <option value="gold" data-i18n="theme.gold"></option>
                <option value="volt" data-i18n="theme.volt"></option>
                <option value="light" data-i18n="theme.light"></option>
              </select>
            </label>
            <label><span data-i18n="frame"></span>
              <select id="frame">
                <option value="angled" data-i18n="frame.angled"></option>
                <option value="rounded" data-i18n="frame.rounded"></option>
                <option value="tech" data-i18n="frame.tech"></option>
              </select>
            </label>
          </div>
          <div class="row">
            <label><span data-i18n="ring.style"></span>
              <select id="ring-style">
                <option value="neon" data-i18n="ring.neon"></option>
                <option value="solid" data-i18n="ring.solid"></option>
                <option value="minimal" data-i18n="ring.minimal"></option>
              </select>
            </label>
          </div>
          <div class="row">
            <label><span data-i18n="ring.color"></span>
              <select id="ring-color">
                <option value="player" data-i18n="ring.byPlayer"></option>
                <option value="team" data-i18n="ring.byTeam"></option>
                <option value="theme" data-i18n="ring.byTheme"></option>
              </select>
            </label>
            <span id="team-colors" class="team-colors">
              <label class="inline">A <input type="color" id="tc-A"></label>
              <label class="inline">B <input type="color" id="tc-B"></label>
            </span>
          </div>
        </div>
        <div class="badge-opts">
          <label class="inline"><input type="checkbox" id="r-shuttleMark"> <span data-i18n="opt.shuttleMark"></span></label>
          <div class="row">
            <label><span data-i18n="badge.mode"></span>
              <select id="badge-mode">
                <option value="hit" data-i18n="badge.hit"></option>
                <option value="fixed" data-i18n="badge.fixed"></option>
                <option value="off" data-i18n="badge.off"></option>
              </select>
            </label>
            <label><span data-i18n="badge.secs"></span>
              <select id="badge-secs">
                <option value="0.5">0.5</option><option value="0.7">0.7</option><option value="1">1</option>
                <option value="1.5">1.5</option><option value="2">2</option><option value="3">3</option>
              </select>
            </label>
          </div>
          <p class="hint" data-i18n="badge.ranks"></p>
          <div class="row ranks">
            <label>SSS <input type="number" id="rank-SSS" min="1" max="999" step="10"></label>
            <label>SS <input type="number" id="rank-SS" min="1" max="999" step="10"></label>
            <label>S <input type="number" id="rank-S" min="1" max="999" step="10"></label>
            <label>A <input type="number" id="rank-A" min="1" max="999" step="10"></label>
            <label>B <input type="number" id="rank-B" min="1" max="999" step="10"></label>
          </div>
        </div>
        <p class="hint" data-i18n="layout.hint"></p>
        <div class="row"><button class="ghost" id="btn-layout-reset" data-i18n="layout.reset"></button></div>
        <div class="score-opts">
          <label class="inline"><input type="checkbox" id="score-on"> <span data-i18n="score.on"></span></label>
          <div class="row">
            <label><span data-i18n="score.startA"></span><input type="number" id="score-a" min="0" max="30" step="1"></label>
            <label><span data-i18n="score.startB"></span><input type="number" id="score-b" min="0" max="30" step="1"></label>
          </div>
          <label class="inline"><input type="checkbox" id="score-review"> <span data-i18n="score.review"></span></label>
        </div>
        <div class="hl-opts">
          <label class="inline"><input type="checkbox" id="hl-on"> <span data-i18n="hl.on"></span></label>
          <div class="row">
            <label><span data-i18n="hl.count"></span>
              <select id="hl-count">
                <option value="3">3</option><option value="5">5</option><option value="8">8</option>
                <option value="0" data-i18n="hl.all"></option>
              </select>
            </label>
          </div>
        </div>
        <label class="inline"><input type="checkbox" id="save-direct" checked> <span data-i18n="saveDirect"></span></label>
        <div class="row">
          <button class="primary" id="btn-render" data-i18n="render"></button>
          <button class="ghost danger" id="btn-cancel" disabled data-i18n="cancel"></button>
        </div>
        <div class="progress"><div id="bar"></div></div>
        <div id="render-status" class="status"></div>
        <div id="review" class="review" hidden>
          <p id="review-head" class="hint"></p>
          <ol id="review-rows" class="review-rows"></ol>
          <div id="review-final" class="review-final"></div>
          <button class="primary" id="btn-review-ok" data-i18n="rv.ok"></button>
        </div>
        <div id="downloads" class="row"></div>
        <div class="step-nav">
          <button class="ghost" data-go="players" data-i18n="nav.back"></button>
        </div>
      </section>
    </aside>

    <section class="stage">
      <div class="stage-head">
        <span id="stage-title"></span>
      </div>
      <div class="stage-body">
        <canvas id="stage" hidden></canvas>
        <canvas id="out" hidden></canvas>
        <div id="empty" class="empty">
          <div class="empty-mark"></div>
          <p data-i18n="empty"></p>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
